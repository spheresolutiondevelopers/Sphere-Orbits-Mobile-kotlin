let currentView = 'grid';

function nt_renderNotes(filter=''){
  const pinned = notes.filter(n=>n.pinned && (!filter || n.title.toLowerCase().includes(filter)||n.body.toLowerCase().includes(filter)));
  const regular = notes.filter(n=>!n.pinned && (!filter || n.title.toLowerCase().includes(filter)||n.body.toLowerCase().includes(filter)));

  const area = document.getElementById('contentArea');
  area.innerHTML = `
    ${pinned.length?`
    <div class="pinned-section">
      <div class="section-header"><span class="section-title"><i class="fas fa-thumbtack"></i> Pinned</span><span class="section-count">${pinned.length}</span></div>
      <div class="pinned-row">
        ${pinned.map(n=>nt_renderPinned(n)).join('')}
      </div>
    </div>`:''}
    <div class="section-header"><span class="section-title"><i class="fas fa-clock"></i> All Notes</span><span class="section-count">${regular.length}</span></div>
    <div class="${currentView==='grid'?'masonry':'masonry'}" id="notesGrid">
      ${regular.map(n=>nt_renderCard(n)).join('')}
    </div>
  `;
}

function nt_renderPinned(n){
  return `<div class="pinned-card nt-${n.color}" onclick="nt_openNote(${n.id})">
    <div class="pin-icon"><i class="fas fa-thumbtack"></i></div>
    <div class="pc-title">${n.title}</div>
    <div class="pc-body">${n.type==='checklist'?n.checklist.map(c=>c.text).join(' · '):n.body}</div>
    <div class="pc-footer">
      ${n.tags.slice(0,2).map(t=>`<span class="pc-tag">#${t}</span>`).join('')}
      <span class="pc-date">${n.date}</span>
    </div>
  </div>`;
}

function nt_renderCard(n){
  const linked = n.linked?`<div class="nc-linked"><i class="fas fa-calendar-star"></i>${n.linked}</div>`:'';
  let body = '';
  if(n.type==='checklist'){
    body = `<ul class="nc-checklist">${n.checklist.map(c=>`
      <li class="${c.done?'done':''}">
        <div class="nc-chk nt-${n.color}" style="background:${c.done?'currentColor':'transparent'}">${c.done?'<i class="fas fa-check" style="color:var(--bg)"></i>':''}</div>
        <span>${c.text}</span>
      </li>`).join('')}</ul>`;
  } else {
    body = `<div class="nc-body">${n.body.replace(/\n/g,'<br>')}</div>`;
  }
  return `<div class="note-card nt-${n.color}" onclick="nt_openNote(${n.id})">
    <div class="nc-actions">
      <div class="nca" title="Pin" onclick="event.stopPropagation();nt_pinNote(${n.id})"><i class="fas fa-thumbtack"></i></div>
      <div class="nca" title="Edit"><i class="fas fa-pencil"></i></div>
      <div class="nca" title="Delete" onclick="event.stopPropagation();nt_deleteNote(${n.id})"><i class="fas fa-trash"></i></div>
    </div>
    ${n.title?`<div class="nc-title">${n.title}</div>`:''}
    ${body}
    <div class="nc-tags">${n.tags.map(t=>`<span class="nc-tag">#${t}</span>`).join('')}</div>
    <div class="nc-footer"><span class="nc-date">${n.date}</span>${linked}</div>
  </div>`;
}

// ── EDITOR (full-screen page, not a popup) ──

const nt_colorMap = {violet:'#A78BFA',rose:'#FB7185',amber:'#FBBF24',teal:'#2DD4A0',sky:'#38BDF8',pink:'#F472B6',lime:'#84CC16',orange:'#FB923C'};

function nt_showEditorPage(){
  document.getElementById('page-notes').classList.remove('active');
  document.getElementById('page-note-editor').classList.add('active');
}

function nt_hideEditorPage(){
  document.getElementById('page-note-editor').classList.remove('active');
  document.getElementById('page-notes').classList.add('active');
}

function nt_updatePinButton(){
  const btn = document.getElementById('editorPinBtn');
  if(!btn) return;
  btn.style.color = isPinned ? 'var(--amber)' : '';
  btn.style.background = isPinned ? 'rgba(251,191,36,.15)' : '';
}

function nt_openNote(id){
  const n = notes.find(x=>x.id===id);
  if(!n) return;
  editingNoteId = id;
  document.getElementById('editorTitleLabel').textContent = 'Edit Note';
  document.getElementById('editorDeleteBtn').style.display = 'flex';
  document.getElementById('noteTitleInput').value = n.title;
  const editor = document.getElementById('noteBodyInput');
  if(n.bodyHtml){
    editor.innerHTML = n.bodyHtml;
  } else {
    const plain = n.type==='checklist' ? n.checklist.map(c=>(c.done?'☑ ':'☐ ')+c.text).join('\n') : n.body;
    editor.innerHTML = nt_escapeHtml(plain).replace(/\n/g,'<br>');
  }
  nt_updateEditorEmptyState();
  selectedColor = n.color;
  isPinned = !!n.pinned;
  nt_updatePinButton();
  document.querySelectorAll('.cp-swatch').forEach(s=>{ s.classList.toggle('sel', s.style.background===nt_colorMap[n.color]); });
  nt_showEditorPage();
}

function nt_openModal(){
  editingNoteId = null;
  document.getElementById('editorTitleLabel').textContent = 'New Note';
  document.getElementById('editorDeleteBtn').style.display = 'none';
  document.getElementById('noteTitleInput').value='';
  const editor = document.getElementById('noteBodyInput');
  editor.innerHTML='';
  nt_updateEditorEmptyState();
  selectedColor='violet';
  isPinned=false;
  nt_updatePinButton();
  document.querySelectorAll('.cp-swatch').forEach((s,i)=>{s.classList.toggle('sel',i===0);});
  nt_showEditorPage();
  setTimeout(()=>document.getElementById('noteTitleInput').focus(),150);
}

function nt_closeModal(){ nt_hideEditorPage(); }

function nt_pickColor(el, color){
  document.querySelectorAll('.cp-swatch').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
  selectedColor = color;
}

function nt_togglePin(btn){
  isPinned = !isPinned;
  btn.style.color = isPinned ? 'var(--amber)' : '';
  btn.style.background = isPinned ? 'rgba(251,191,36,.15)' : '';
}

// ── formatting toolbar ──
function nt_fmt(cmd){
  document.getElementById('noteBodyInput').focus();
  document.execCommand(cmd, false, null);
  nt_updateToolbarState();
}

function nt_blockAncestor(tagName){
  const sel = document.getSelection();
  if(!sel.rangeCount) return null;
  let node = sel.anchorNode;
  while(node && node.nodeType!==1) node = node.parentNode;
  return node && node.closest ? node.closest(tagName) : null;
}

function nt_toggleHeading(){
  const editor = document.getElementById('noteBodyInput');
  editor.focus();
  const isH = nt_blockAncestor('h3');
  document.execCommand('formatBlock', false, isH ? 'P' : 'H3');
}

function nt_toggleQuote(){
  const editor = document.getElementById('noteBodyInput');
  editor.focus();
  const isQ = nt_blockAncestor('blockquote');
  document.execCommand('formatBlock', false, isQ ? 'P' : 'BLOCKQUOTE');
}

function nt_insertChecklist(){
  const editor = document.getElementById('noteBodyInput');
  editor.focus();
  const html = '<div class="ed-check-item" contenteditable="false"><span class="ed-check-box" onclick="nt_toggleCheckItem(this)"></span><span class="ed-check-text" contenteditable="true">Checklist item</span></div><p><br></p>';
  document.execCommand('insertHTML', false, html);
}

function nt_toggleCheckItem(box){
  box.classList.toggle('checked');
  box.closest('.ed-check-item').classList.toggle('done', box.classList.contains('checked'));
}

// ── table (e.g. budget tables) ──
function nt_insertTable(){
  const editor = document.getElementById('noteBodyInput');
  editor.focus();
  const rows=3, cols=3;
  let html = '<div class="note-table-wrap" contenteditable="false"><table class="note-table"><tbody>';
  for(let r=0;r<rows;r++){
    html += '<tr>';
    for(let c=0;c<cols;c++){ html += '<td contenteditable="true"></td>'; }
    html += '</tr>';
  }
  html += '</tbody></table><div class="note-table-controls">'
    + '<button type="button" onclick="nt_tableAddRow(this)"><i class="fas fa-plus"></i> Row</button>'
    + '<button type="button" onclick="nt_tableAddCol(this)"><i class="fas fa-plus"></i> Col</button>'
    + '<button type="button" onclick="nt_tableDelRow(this)"><i class="fas fa-minus"></i> Row</button>'
    + '<button type="button" onclick="nt_tableDelCol(this)"><i class="fas fa-minus"></i> Col</button>'
    + '<button type="button" class="danger" onclick="nt_tableRemove(this)"><i class="fas fa-trash"></i> Delete table</button>'
    + '</div></div><p><br></p>';
  document.execCommand('insertHTML', false, html);
}
function nt_tableAddRow(btn){
  const table = btn.closest('.note-table-wrap').querySelector('table');
  const cols = table.rows[0].cells.length;
  const tr = table.insertRow(-1);
  for(let i=0;i<cols;i++){ const td=tr.insertCell(-1); td.contentEditable='true'; }
}
function nt_tableAddCol(btn){
  const table = btn.closest('.note-table-wrap').querySelector('table');
  for(const row of table.rows){ const td=row.insertCell(-1); td.contentEditable='true'; }
}
function nt_tableDelRow(btn){
  const table = btn.closest('.note-table-wrap').querySelector('table');
  if(table.rows.length>1) table.deleteRow(-1);
}
function nt_tableDelCol(btn){
  const table = btn.closest('.note-table-wrap').querySelector('table');
  if(table.rows[0].cells.length>1){ for(const row of table.rows){ row.deleteCell(-1); } }
}
function nt_tableRemove(btn){
  btn.closest('.note-table-wrap').remove();
}

// ── editor state helpers ──
function nt_updateEditorEmptyState(){
  const editor = document.getElementById('noteBodyInput');
  const html = editor.innerHTML.trim();
  editor.classList.toggle('is-empty', html==='' || html==='<br>');
}

function nt_updateToolbarState(){
  ['bold','italic','underline','strikeThrough','insertUnorderedList'].forEach(cmd=>{
    const btn = document.querySelector(`.mt-btn[data-cmd="${cmd}"]`);
    if(!btn) return;
    let on = false;
    try{ on = document.queryCommandState(cmd); }catch(e){}
    btn.classList.toggle('on', on);
  });
}

function nt_escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function nt_htmlToPlainText(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  tmp.querySelectorAll('br').forEach(el=>el.replaceWith('\n'));
  tmp.querySelectorAll('td,th').forEach(el=>el.insertAdjacentText('afterend',' | '));
  tmp.querySelectorAll('tr').forEach(el=>el.insertAdjacentText('afterend','\n'));
  tmp.querySelectorAll('div,p,li,h3,blockquote').forEach(el=>el.insertAdjacentText('afterend','\n'));
  return tmp.textContent.replace(/ \| \n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}

function nt_saveNote(){
  const title = document.getElementById('noteTitleInput').value.trim();
  const editor = document.getElementById('noteBodyInput');
  const rawHtml = editor.innerHTML.trim();
  const bodyHtml = (rawHtml==='<br>') ? '' : rawHtml;
  const body = nt_htmlToPlainText(bodyHtml);
  if(!title && !body){ nt_closeModal(); return; }
  const now = new Date().toLocaleDateString('en-KE',{month:'short',day:'numeric',year:'numeric'});
  if(editingNoteId){
    const n = notes.find(x=>x.id===editingNoteId);
    if(n){ n.title=title; n.body=body; n.bodyHtml=bodyHtml; n.color=selectedColor; n.pinned=isPinned; n.type='text'; }
  } else {
    notes.unshift({ id: Date.now(), title, body, bodyHtml, color: selectedColor, tags:['personal'], pinned: isPinned, date: now, type:'text' });
  }
  const wasEdit = !!editingNoteId;
  nt_closeModal();
  nt_renderNotes();
  nt_showToast(wasEdit?'Note updated!':'Note saved!');
}

function nt_deleteNote(id){
  const idx = notes.findIndex(n=>n.id===id);
  if(idx>-1){ notes.splice(idx,1); nt_renderNotes(); nt_showToast('Note deleted'); }
}

function nt_deleteFromEditor(){
  if(editingNoteId!=null){
    nt_deleteNote(editingNoteId);
    nt_closeModal();
  }
}

function nt_pinNote(id){
  const n = notes.find(x=>x.id===id);
  if(n){ n.pinned=!n.pinned; nt_renderNotes(); nt_showToast(n.pinned?'Note pinned!':'Note unpinned'); }
}

function nt_filterNotes(q){ nt_renderNotes(q.toLowerCase()); }
function nt_setView(v){ currentView=v; document.getElementById('gridBtn').classList.toggle('active',v==='grid'); document.getElementById('listBtn').classList.toggle('active',v==='list'); nt_renderNotes(); }

function nt_addTag(e){ if(e.key==='Enter'){ const v=e.target.value.trim(); if(v){ const chip=document.createElement('div'); chip.className='tag-chip'; chip.innerHTML=`${v} <i class="fas fa-times" onclick="this.parentElement.remove()"></i>`; e.target.before(chip); e.target.value=''; } } }
function nt_removeTag(el){ el.parentElement.remove(); }

function nt_showToast(msg){ const t=document.getElementById('toast'); document.getElementById('toastMsg').textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }

// ── MOBILE RESPONSIVE ──
if(window.screen && window.screen.width <= 768){
  document.body.classList.add('truly-mobile');
}

function nt_toggleSidebar(){
  const sb=document.querySelector('#page-notes .sidebar');
  const bd=document.getElementById('ntSbBackdrop');
  if(!sb) return;
  sb.classList.toggle('open');
  if(bd) bd.classList.toggle('show');
  document.body.style.overflow=sb.classList.contains('open')?'hidden':'';
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
}

// Render initial state (standalone extraction)
// Keep the editor's placeholder + toolbar active-state in sync as the user types/selects
(function(){
  const editor = document.getElementById('noteBodyInput');
  if(!editor) return;
  editor.addEventListener('input', nt_updateEditorEmptyState);
  editor.addEventListener('keyup', nt_updateToolbarState);
  editor.addEventListener('mouseup', nt_updateToolbarState);
  document.addEventListener('selectionchange', ()=>{
    if(document.activeElement === editor) nt_updateToolbarState();
  });
})();

nt_renderNotes();
</script>
