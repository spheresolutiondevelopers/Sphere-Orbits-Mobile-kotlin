# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Increased memory for faster build performance in multi-module project.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Djava.rmi.server.hostname=127.0.0.1

# Kotlin daemon JVM arguments
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Djava.net.preferIPv4Stack=true -Djava.rmi.server.hostname=127.0.0.1

# Force the use of the daemon and avoid slow fallbacks
kotlin.compiler.execution.strategy=daemon

# When configured, Gradle will run in parallel mode.
org.gradle.parallel=true

# Enable build cache for faster incremental builds.
org.gradle.caching=true

# Enable configuration on demand for faster builds in multi-module projects.
org.gradle.configureondemand=false

# Use file system watching for faster change detection.
org.gradle.vfs.watch=true

# AndroidX package structure to make it clearer which packages are part of the Android SDK,
# and which are part of AndroidX external libraries.
android.useAndroidX=true

# Non-transitive R classes to speed up builds
android.nonTransitiveRClass=true

# Enable KSP incremental compilation
ksp.incremental=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Optimize dexing
# Note: android.enableDexingArtifactTransform was removed in AGP 8.3.
# Use android.useFullClasspathForDexingTransform if needed.
android.useFullClasspathForDexingTransform=true
